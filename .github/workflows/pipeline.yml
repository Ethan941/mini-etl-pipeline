name: pipeline

on:
  schedule:
    - cron: "0 6 * * *" # tous les jours à 06:00 UTC
  workflow_dispatch: # lancement manuel depuis l'onglet Actions

permissions:
  contents: write # pour committer la base mise à jour

env:
  COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
  COINS: bitcoin,ethereum,solana,cardano,ripple
  VS_CURRENCY: eur
  DUCKDB_PATH: data/crypto.duckdb

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python src/main.py
      - run: dbt build --project-dir dbt --profiles-dir dbt
      - name: Commit la base mise à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # shortcut: la base est versionnée dans git (-f car *.duckdb est ignoré), à remplacer par un stockage externe si elle grossit
          git add -f data/crypto.duckdb
          git diff --staged --quiet || (git commit -m "chore: daily data update" && git push)
